name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin Xcode explicitly; update together with the runner image (see CLAUDE.md).
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  IPAD_NAME: iPad Pro 13-inch (M5)
  IPAD_OS: "26.5"

jobs:
  # Decides whether the macOS runner jobs are needed. PRs that only touch docs
  # or Claude configuration skip them; everything else (and every push to main)
  # runs the full pipeline. Unknown paths always count as code.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # A PR checks out its merge commit; depth 2 brings its first parent
      # (the base branch), so HEAD^1..HEAD is exactly what the PR changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" != "pull_request" ]; then
            echo "Event ${EVENT}: running the full pipeline."
            echo "code=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          files=$(git diff --name-only HEAD^1 HEAD)
          code=false
          if [ -z "${files}" ]; then
            code=true
          fi
          while IFS= read -r file; do
            if [ -z "${file}" ]; then
              continue
            fi
            case "${file}" in
              docs/* | .claude/* | .github/ISSUE_TEMPLATE/* | \
              .github/pull_request_template.md | LICENSE)
                kind="docs" ;;
              */*)
                kind="code" ;;   # e.g. Fixtures/README.md: tests may read it
              *.md)
                kind="docs" ;;   # Markdown in the repository root only
              *)
                kind="code" ;;
            esac
            echo "${kind}  ${file}"
            if [ "${kind}" = "code" ]; then
              code=true
            fi
          done <<< "${files}"

          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          if [ "${code}" = "true" ]; then
            echo "Code changes found: running the full pipeline." | tee -a "${GITHUB_STEP_SUMMARY}"
          else
            echo "Docs or Claude configuration only: skipping macOS and iPad jobs." | tee -a "${GITHUB_STEP_SUMMARY}"
          fi

  packages:
    name: Packages (swift test)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Test packages
        run: |
          set -euo pipefail
          for package in Packages/*/; do
            echo "::group::swift test ${package}"
            swift test --package-path "${package}"
            echo "::endgroup::"
          done

  macos:
    name: macOS (build + test)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        run: |
          set -euo pipefail
          xcodebuild -project SlidePilot.xcodeproj -scheme SlidePilot \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build test
      # Keeps the Mac snapshot target building and working (see CLAUDE.md).
      - name: Mac snapshots
        run: |
          set -euo pipefail
          xcodebuild -project SlidePilot.xcodeproj -scheme SlidePilotMacSnapshots \
            -destination 'platform=macOS' \
            -resultBundlePath build/MacSnapshots.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test
          python3 -I scripts/export-mac-snapshots.py

  ipados:
    name: iPadOS simulator (build + test)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # On some runners the simulator runtimes are not loaded yet when the job
      # starts, and xcodebuild then finds no iPad at all. Wait for the runtime,
      # create the device if the image lacks it, and boot it before building.
      - name: Prepare iPad simulator
        id: simulator
        run: |
          set -euo pipefail
          # Several runtimes can share a version (e.g. iPhone-only ones), so pick
          # the one that supports the iPad. Prints "<runtime> <device type>".
          query='[.runtimes[]
            | select(.platform == "iOS" and (.version == $os or (.version | startswith($os + "."))))
            | {rt: .identifier, dt: ([.supportedDeviceTypes[]? | select(.name == $name)][0].identifier)}
            | select(.dt != null)][0] // empty | "\(.rt) \(.dt)"'
          match=""
          for attempt in $(seq 1 30); do
            match=$(xcrun simctl list runtimes available -j \
              | jq -r --arg os "${IPAD_OS}" --arg name "${IPAD_NAME}" "${query}")
            [ -n "${match}" ] && break
            echo "iOS ${IPAD_OS} runtime for ${IPAD_NAME} not available yet (attempt ${attempt}/30)"
            sleep 10
          done
          if [ -z "${match}" ]; then
            echo "::error::No iOS ${IPAD_OS} simulator runtime with ${IPAD_NAME} on this runner."
            xcrun simctl list runtimes
            exit 1
          fi
          read -r runtime device_type <<< "${match}"

          udid=$(xcrun simctl list devices available -j \
            | jq -r --arg rt "${runtime}" --arg name "${IPAD_NAME}" \
              '[.devices[$rt][]? | select(.name == $name)][0].udid // empty')
          if [ -z "${udid}" ]; then
            echo "Creating '${IPAD_NAME}' on ${runtime}"
            udid=$(xcrun simctl create "${IPAD_NAME}" "${device_type}" "${runtime}")
          fi

          echo "Using ${IPAD_NAME} (${udid}) on ${runtime}"
          xcrun simctl bootstatus "${udid}" -b
          echo "udid=${udid}" >> "${GITHUB_OUTPUT}"
      - name: Build and test
        env:
          IPAD_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcodebuild -project SlidePilot.xcodeproj -scheme SlidePilot \
            -destination "platform=iOS Simulator,id=${IPAD_UDID}" \
            CODE_SIGNING_ALLOWED=NO \
            build test

  no-screen-capture:
    name: No screen capture APIs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check sources
        run: sh scripts/check-no-screen-capture.sh

  # Single stable status check for the main branch ruleset. It always runs, so
  # docs-only PRs still report it. A skipped job only counts as passed when the
  # change detection itself succeeded and found no code changes.
  ci-success:
    name: ci-success
    if: always()
    needs: [changes, packages, macos, ipados, no-screen-capture]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Change detection: ${CHANGES_RESULT} (code=${CODE})"
          echo "Job results: ${RESULTS}"
          if [ "${CHANGES_RESULT}" != "success" ]; then
            echo "::error::Change detection did not succeed."
            exit 1
          fi
          for result in ${RESULTS}; do
            if [ "${result}" = "success" ]; then
              continue
            fi
            if [ "${result}" = "skipped" ] && [ "${CODE}" = "false" ]; then
              continue
            fi
            echo "::error::At least one CI job did not succeed."
            exit 1
          done
