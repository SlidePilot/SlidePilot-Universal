name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin Xcode explicitly; update together with the runner image (see CLAUDE.md).
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  # Preferred iPad simulator; CI falls back to another available iPad.
  IPAD_NAME: iPad Pro 13-inch (M5)
  IPAD_OS: "26.5"

jobs:
  packages:
    name: Packages (swift test)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Test packages
        run: |
          set -euo pipefail
          for package in Packages/*/; do
            echo "::group::swift test ${package}"
            swift test --package-path "${package}"
            echo "::endgroup::"
          done

  macos:
    name: macOS (build + test)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        run: |
          set -euo pipefail
          xcodebuild -project SlidePilot.xcodeproj -scheme SlidePilot \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build test

  ipados:
    name: iPadOS simulator (build + test)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runners sometimes lack the pinned simulator, or list it only after
      # CoreSimulator has finished loading. Pick an available iPad by UDID
      # (preferring the pinned one) and boot it before building.
      - name: Pick and boot iPad simulator
        run: |
          set -euo pipefail
          udid=""
          for attempt in 1 2 3 4 5 6; do
            udid="$(xcrun simctl list devices available --json \
              | python3 .github/scripts/pick_ipad_simulator.py "${IPAD_NAME}" "${IPAD_OS}")"
            if [ -n "${udid}" ]; then break; fi
            echo "No iPad simulator listed yet (attempt ${attempt}), waiting..."
            sleep 10
          done
          if [ -z "${udid}" ]; then
            echo "::error::No iPad simulator available on this runner."
            xcrun simctl list runtimes
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl bootstatus "${udid}" -b
          echo "IPAD_UDID=${udid}" >> "${GITHUB_ENV}"
      - name: Build and test
        run: |
          set -euo pipefail
          xcodebuild -project SlidePilot.xcodeproj -scheme SlidePilot \
            -destination "platform=iOS Simulator,id=${IPAD_UDID}" \
            CODE_SIGNING_ALLOWED=NO \
            build test

  # Single stable status check for the main branch ruleset.
  ci-success:
    name: ci-success
    if: always()
    needs: [packages, macos, ipados]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "::error::At least one CI job did not succeed."
              exit 1
            fi
          done
