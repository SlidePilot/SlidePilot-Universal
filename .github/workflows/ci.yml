name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin Xcode explicitly; update together with the runner image (see CLAUDE.md).
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  # Decides whether the macOS runner jobs are needed. PRs that only touch docs
  # or Claude configuration skip them; everything else (and every push to main)
  # runs the full pipeline. Unknown paths always count as code.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # A PR checks out its merge commit; depth 2 brings its first parent
      # (the base branch), so HEAD^1..HEAD is exactly what the PR changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" != "pull_request" ]; then
            echo "Event ${EVENT}: running the full pipeline."
            echo "code=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          files=$(git diff --name-only HEAD^1 HEAD)
          code=false
          if [ -z "${files}" ]; then
            code=true
          fi
          while IFS= read -r file; do
            if [ -z "${file}" ]; then
              continue
            fi
            case "${file}" in
              docs/* | site/* | .claude/* | .github/ISSUE_TEMPLATE/* | \
              .github/pull_request_template.md | LICENSE)
                kind="docs" ;;
              */*)
                kind="code" ;;   # e.g. Fixtures/README.md: tests may read it
              *.md)
                kind="docs" ;;   # Markdown in the repository root only
              *)
                kind="code" ;;
            esac
            echo "${kind}  ${file}"
            if [ "${kind}" = "code" ]; then
              code=true
            fi
          done <<< "${files}"

          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          if [ "${code}" = "true" ]; then
            echo "Code changes found: running the full pipeline." | tee -a "${GITHUB_STEP_SUMMARY}"
          else
            echo "Docs or Claude configuration only: skipping macOS and iOS jobs." | tee -a "${GITHUB_STEP_SUMMARY}"
          fi

  packages:
    name: Packages (swift test)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Test packages
        run: |
          set -euo pipefail
          for package in Packages/*/; do
            echo "::group::swift test ${package}"
            swift test --package-path "${package}"
            echo "::endgroup::"
          done

  macos:
    name: macOS (build + test)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        run: |
          set -euo pipefail
          xcodebuild -project SlidePilot.xcodeproj -scheme SlidePilot \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build test
      # Keeps the free Mac download (donation hint, ADR 0011) building.
      - name: Free download build
        run: |
          set -euo pipefail
          xcodebuild -project SlidePilot.xcodeproj -scheme "SlidePilot Free Download" \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
      # Keeps the Mac snapshot target building and working (see CLAUDE.md).
      - name: Mac snapshots
        run: |
          set -euo pipefail
          xcodebuild -project SlidePilot.xcodeproj -scheme SlidePilotMacSnapshots \
            -destination 'platform=macOS' \
            -resultBundlePath build/MacSnapshots.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test
          python3 -I scripts/export-mac-snapshots.py
      # Keeps the Mac test host compiling (ADR 0018). It is not run in CI.
      - name: Mac test host
        run: sh Tools/TestHost/build.sh

  # Compiles the iOS app (iPad and iPhone share the SDK and binary), so
  # iOS-only code breaks the PR. It does not run tests: the test plan holds only
  # package tests, which the packages and macOS jobs already run, and booting a
  # simulator took most of this job's time (ADR 0008, amendment 2026-11-26).
  ipados:
    name: iOS (build)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Index store is off because CI does not use it.
      - name: Build
        run: |
          set -euo pipefail
          xcodebuild -project SlidePilot.xcodeproj -scheme SlidePilot \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

  no-screen-capture:
    name: No screen capture APIs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check sources
        run: sh scripts/check-no-screen-capture.sh

  # Every planned parity item must name the open issue that implements it, so
  # none is forgotten on the project board (see docs/feature-parity.md).
  parity-issues:
    name: Planned parity items have issues
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check docs/feature-parity.md
        run: python3 -I scripts/check-parity-issues.py

  # Single stable status check for the main branch ruleset. It always runs, so
  # docs-only PRs still report it. A skipped job only counts as passed when the
  # change detection itself succeeded and found no code changes.
  ci-success:
    name: ci-success
    if: always()
    needs: [changes, packages, macos, ipados, no-screen-capture, parity-issues]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Change detection: ${CHANGES_RESULT} (code=${CODE})"
          echo "Job results: ${RESULTS}"
          if [ "${CHANGES_RESULT}" != "success" ]; then
            echo "::error::Change detection did not succeed."
            exit 1
          fi
          for result in ${RESULTS}; do
            if [ "${result}" = "success" ]; then
              continue
            fi
            if [ "${result}" = "skipped" ] && [ "${CODE}" = "false" ]; then
              continue
            fi
            echo "::error::At least one CI job did not succeed."
            exit 1
          done
